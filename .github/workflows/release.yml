name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: v
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'v0.0.0-dev' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, single file)
        shell: pwsh
        run: >
          dotnet publish src/DesktopCompanion -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.v.outputs.ver }}
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "DesktopCompanion-${{ steps.v.outputs.tag }}-win-x64"
          Compress-Archive publish/DesktopCompanion.exe "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopCompanion-win-x64
          path: DesktopCompanion-*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Desktop Companion ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: DesktopCompanion-*
